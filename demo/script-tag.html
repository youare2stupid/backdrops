<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>backdrops - one script tag</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; color: #fff; }
      section { min-height: 100vh; display: grid; place-content: center; gap: 10px; text-align: center; padding: 24px; }
      h1 { margin: 0; font-size: clamp(32px, 7vw, 72px); letter-spacing: -0.04em; }
      p { margin: 0; color: rgba(255, 255, 255, 0.75); }
      a { color: #fff; }
    </style>
  </head>
  <body>
    <section
      data-backdrop="liquid"
      data-backdrop-colors="#2b0b3a,#7a1f56,#e0563f,#ffc36b"
      data-backdrop-scale="3"
      data-backdrop-dots-pitch="4"
      data-backdrop-warp="4"
    >
      <h1>no JavaScript of your own</h1>
      <p>This whole background comes from data attributes and one script tag.</p>
      <p><a href="./index.html">back to the playground</a></p>
    </section>
    <script src="../dist/backdrops.js"></script>
    <script>
      Backdrops.ready();
    </script>
  </body>
</html>
