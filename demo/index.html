<!doctype html>
<html lang="en" data-tone="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>backdrops</title>
    <style>
      :root {
        --ink: #f5f8ff;
        --dim: rgba(245, 248, 255, 0.62);
        --panel: rgba(8, 12, 18, 0.55);
        --line: rgba(255, 255, 255, 0.16);
        --accent: #9fd0f5;
        --code: rgba(0, 0, 0, 0.3);
      }
      html[data-tone='light'] {
        --ink: #1d1412;
        --dim: rgba(29, 20, 18, 0.62);
        --panel: rgba(255, 252, 251, 0.52);
        --line: rgba(29, 20, 18, 0.18);
        --accent: #8c4a3d;
        --code: rgba(255, 255, 255, 0.42);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: transparent;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: relative;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 24px;
        padding: clamp(20px, 4vw, 64px);
        max-width: 1400px;
      }
      header { display: grid; gap: 14px; max-width: 34ch; }
      header h1,
      header p,
      header a {
        color: #fff;
        mix-blend-mode: difference;
      }
      h1 { margin: 0; font-size: clamp(38px, 7vw, 92px); line-height: 0.95; letter-spacing: -0.045em; font-weight: 800; }
      p { margin: 0; font-size: clamp(14px, 1.3vw, 17px); }
      header p { color: #fff; opacity: 0.82; }
      a { color: #fff; }

      .panel {
        width: min(430px, 100%);
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.26);
      }
      .panel h2 {
        margin: 0 0 8px;
        font-size: 11.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .panel h2 span { color: var(--accent); }
      .step + .step { margin-top: 14px; }

      .choices { display: grid; gap: 8px; }
      .choices--effects { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .choices--palettes { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .choice {
        display: grid;
        gap: 6px;
        padding: 8px 9px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        text-align: left;
        cursor: pointer;
      }
      .choice:hover { background: rgba(255, 255, 255, 0.14); }
      .choice[aria-pressed='true'] { border-color: var(--accent); background: rgba(255, 255, 255, 0.16); }
      .choice small { color: var(--dim); font-size: 11px; line-height: 1.3; }
      .bar { display: flex; height: 11px; border-radius: 4px; overflow: hidden; }
      .bar i { flex: 1; }

      .tabs { display: flex; gap: 6px; margin: 16px 0 8px; }
      .tabs button,
      .copy {
        font: inherit;
        font-size: 12.5px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: none;
        color: var(--dim);
        cursor: pointer;
      }
      .tabs button[aria-pressed='true'] { color: var(--ink); border-color: var(--accent); }
      .copy { float: right; }
      pre {
        clear: both;
        margin: 0;
        padding: 12px;
        border-radius: 12px;
        background: var(--code);
        font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 38vh;
        overflow: auto;
        white-space: pre;
      }
      @media (max-width: 720px) {
        .stage { justify-content: flex-start; padding-bottom: 62vh; }
        .panel { position: fixed; left: 10px; right: 10px; bottom: 10px; }
        pre { max-height: 26vh; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <header>
        <h1>backdrops</h1>
        <p>Animated backgrounds for the web. Pick an effect, then a palette, and copy the snippet.</p>
        <p><a href="./script-tag.html">the same thing from data attributes</a></p>
      </header>

      <section class="panel">
        <div class="step">
          <h2>1 &middot; effect <span id="effect-note"></span></h2>
          <div class="choices choices--effects" id="effects"></div>
        </div>
        <div class="step">
          <h2>2 &middot; palette</h2>
          <div class="choices choices--palettes" id="palettes"></div>
        </div>
        <div class="tabs">
          <button id="tab-js" aria-pressed="true">javascript</button>
          <button id="tab-html" aria-pressed="false">markup</button>
          <button class="copy" id="copy">copy</button>
        </div>
        <pre id="code"></pre>
      </section>
    </main>

    <script type="module">
      import Backdrops from '../src/backdrops.js';

      const ENGINES = [
        {
          id: 'liquid',
          label: 'liquid',
          note: 'WebGL noise field, halftone dots, grain',
          options: { contrast: 1.42, grain: 0.85, vignette: 0.14 }
        },
        {
          id: 'goo',
          label: 'goo',
          note: 'Canvas blobs that melt together',
          options: { blobCount: 18, blobSize: 0.16, spread: 0.55, blur: 24, threshold: 10 }
        },
        {
          id: 'aurora',
          label: 'aurora',
          note: 'Canvas curtains of light and stars',
          options: { ribbons: 5, ribbonWidth: 0.3, blur: 34, stars: 90 }
        }
      ];

      const PALETTES = [
        { id: 'deep-water', label: 'Deep water', colors: ['#072563', '#133f8b', '#3e7bcd', '#5f9dea'] },
        { id: 'blush', label: 'Blush', colors: ['#b4828a', '#d29596', '#dcabaa', '#e7b6b5'] },
        { id: 'mint-grove', label: 'Mint grove', colors: ['#04231a', '#0b6b52', '#17c493', '#c9f7e7'] },
        { id: 'sunset-haze', label: 'Sunset haze', colors: ['#2b0b3a', '#7a1f56', '#e0563f', '#ffc36b'] },
        { id: 'graphite', label: 'Graphite', colors: ['#0b0b0c', '#3a3a3f', '#8a8a92', '#f2f2f4'] },
        { id: 'neon', label: 'Neon', colors: ['#0a0014', '#5a00b3', '#ff2d9b', '#8affe4'] }
      ];

      const code = document.getElementById('code');
      const note = document.getElementById('effect-note');
      let engine = ENGINES[0];
      let palette = PALETTES[0];
      let host = null;
      let tab = 'js';

      function flatten(options, prefix) {
        const rows = [];
        for (const [key, value] of Object.entries(options)) {
          const path = prefix ? prefix + '.' + key : key;
          if (value && typeof value === 'object' && !Array.isArray(value)) rows.push(...flatten(value, path));
          else rows.push([path, value]);
        }
        return rows;
      }

      function settings() {
        return { effect: engine.id, colors: palette.colors, ...engine.options };
      }

      function jsSnippet() {
        const rows = flatten(settings());
        return [
          '<script src="dist/backdrops.js"><\/script>',
          '<script>',
          '  Backdrops.page({',
          ...rows.map(([path, value], index) => '    ' + JSON.stringify(path) + ': ' + JSON.stringify(value) + (index === rows.length - 1 ? '' : ',')),
          '  });',
          '<\/script>'
        ].join('\n');
      }

      function htmlSnippet() {
        const rows = flatten(settings()).filter(([path]) => path !== 'effect');
        const attributes = rows.map(
          ([path, value], index) =>
            '         data-backdrop-' + path.replace(/\./g, '-') + '="' + String(value) + '"' + (index === rows.length - 1 ? '>' : '')
        );
        return [
          '<section data-backdrop="' + engine.id + '"',
          ...attributes,
          '  <h1>Your page</h1>',
          '</section>',
          '<script src="dist/backdrops.js"><\/script>',
          '<script>Backdrops.ready();<\/script>'
        ].join('\n');
      }

      function tone(colors) {
        let sum = 0;
        let count = 0;
        for (const value of colors) {
          const hex = String(value).replace('#', '');
          const full = hex.length === 3 ? hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2] : hex;
          const int = parseInt(full.slice(0, 6), 16);
          if (isNaN(int)) continue;
          sum += (0.2126 * ((int >> 16) & 255) + 0.7152 * ((int >> 8) & 255) + 0.0722 * (int & 255)) / 255;
          count++;
        }
        return count && sum / count > 0.55 ? 'light' : 'dark';
      }

      function render() {
        code.textContent = tab === 'js' ? jsSnippet() : htmlSnippet();
        note.textContent = engine.label + ' - ' + engine.note;
        for (const button of document.getElementById('effects').children) {
          button.setAttribute('aria-pressed', String(button.dataset.id === engine.id));
        }
        for (const button of document.getElementById('palettes').children) {
          button.setAttribute('aria-pressed', String(button.dataset.id === palette.id));
        }
        window.__demo = { effect: engine.id, palette: palette.id, settings: settings(), snippet: code.textContent };
      }

      function apply() {
        if (host) host.destroy();
        host = Backdrops.page(settings());
        document.documentElement.setAttribute('data-tone', tone(palette.colors));
        render();
      }

      function bar(colors) {
        const strip = document.createElement('div');
        strip.className = 'bar';
        for (const color of colors) {
          const cell = document.createElement('i');
          cell.style.background = color;
          strip.appendChild(cell);
        }
        return strip;
      }

      for (const item of ENGINES) {
        const button = document.createElement('button');
        button.className = 'choice';
        button.dataset.id = item.id;
        button.title = item.note;
        const label = document.createElement('span');
        label.textContent = item.label;
        const hint = document.createElement('small');
        hint.textContent = item.note.split(',')[0];
        button.append(label, hint);
        button.addEventListener('click', () => {
          engine = item;
          apply();
        });
        document.getElementById('effects').appendChild(button);
      }

      for (const item of PALETTES) {
        const button = document.createElement('button');
        button.className = 'choice';
        button.dataset.id = item.id;
        const label = document.createElement('span');
        label.textContent = item.label;
        button.append(label, bar(item.colors));
        button.addEventListener('click', () => {
          palette = item;
          apply();
        });
        document.getElementById('palettes').appendChild(button);
      }

      document.getElementById('tab-js').addEventListener('click', () => {
        tab = 'js';
        document.getElementById('tab-js').setAttribute('aria-pressed', 'true');
        document.getElementById('tab-html').setAttribute('aria-pressed', 'false');
        render();
      });

      document.getElementById('tab-html').addEventListener('click', () => {
        tab = 'html';
        document.getElementById('tab-html').setAttribute('aria-pressed', 'true');
        document.getElementById('tab-js').setAttribute('aria-pressed', 'false');
        render();
      });

      document.getElementById('copy').addEventListener('click', () => {
        if (navigator.clipboard) navigator.clipboard.writeText(code.textContent);
      });

      apply();
      window.backdrops = { host: () => host, apply, engines: ENGINES, palettes: PALETTES };
    </script>
  </body>
</html>
