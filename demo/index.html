<!doctype html>
<html lang="en" data-tone="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>backdrops</title>
    <style>
      :root {
        --ink: #f5f8ff;
        --dim: rgba(245, 248, 255, 0.6);
        --panel: rgba(8, 12, 18, 0.55);
        --line: rgba(255, 255, 255, 0.16);
        --accent: #9fd0f5;
        --code: rgba(0, 0, 0, 0.3);
      }
      html[data-tone='light'] {
        --ink: #1d1412;
        --dim: rgba(29, 20, 18, 0.6);
        --panel: rgba(255, 252, 251, 0.5);
        --line: rgba(29, 20, 18, 0.18);
        --accent: #8c4a3d;
        --code: rgba(255, 255, 255, 0.42);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--ink);
        background: transparent;
        -webkit-font-smoothing: antialiased;
      }
      .stage {
        position: relative;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(20px, 4vw, 64px);
        max-width: 1400px;
        gap: 24px;
      }
      header { display: grid; gap: 14px; max-width: 34ch; }
      header h1,
      header p,
      header a {
        color: #fff;
        mix-blend-mode: difference;
      }
      h1 { margin: 0; font-size: clamp(38px, 7vw, 92px); line-height: 0.95; letter-spacing: -0.045em; font-weight: 800; }
      p { margin: 0; color: var(--dim); font-size: clamp(14px, 1.3vw, 17px); }
      a { color: var(--ink); }

      .panel {
        width: min(430px, 100%);
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        backdrop-filter: blur(20px) saturate(140%);
        -webkit-backdrop-filter: blur(20px) saturate(140%);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.26);
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .presets {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      .preset {
        display: grid;
        gap: 6px;
        padding: 8px 9px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .preset:hover { background: rgba(255, 255, 255, 0.14); }
      .preset[aria-pressed='true'] { border-color: var(--accent); }
      .preset span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .bar { display: flex; height: 12px; border-radius: 4px; overflow: hidden; }
      .bar i { flex: 1; }

      .tabs { display: flex; gap: 6px; margin: 14px 0 8px; }
      .tabs button, .copy {
        font: inherit;
        font-size: 12.5px;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: none;
        color: var(--dim);
        cursor: pointer;
      }
      .tabs button[aria-pressed='true'] { color: var(--ink); border-color: var(--accent); }
      .copy { float: right; }
      pre {
        clear: both;
        margin: 0;
        padding: 12px;
        border-radius: 12px;
        background: var(--code);
        font: 11.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
        max-height: 44vh;
        overflow: auto;
        white-space: pre;
      }
      .note { font-size: 12.5px; color: var(--dim); margin-top: 8px; }
      @media (max-width: 720px) {
        .stage { justify-content: flex-start; padding-bottom: 60vh; }
        .panel { position: fixed; left: 10px; right: 10px; bottom: 10px; }
        pre { max-height: 30vh; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <header>
        <h1>backdrops</h1>
        <p>Animated backgrounds for the web. Pick one below and copy the snippet.</p>
        <p><a href="./script-tag.html">the same thing from data attributes</a></p>
      </header>

      <section class="panel">
        <h2>ready made</h2>
        <div class="presets" id="presets"></div>
        <div class="tabs">
          <button id="tab-js" aria-pressed="true">javascript</button>
          <button id="tab-html" aria-pressed="false">markup</button>
          <button class="copy" id="copy">copy</button>
        </div>
        <pre id="code"></pre>
        <p class="note" id="note"></p>
      </section>
    </main>

    <script type="module">
      import Backdrops from '../src/backdrops.js';

      const PRESETS = [
        {
          id: 'deep-water',
          label: 'Deep water',
          effect: 'liquid',
          options: {
            colors: ['#072563', '#133f8b', '#3e7bcd', '#5f9dea'],
            contrast: 1.5,
            grain: 0.9,
            vignette: 0.16
          }
        },
        {
          id: 'blush',
          label: 'Blush',
          effect: 'liquid',
          options: {
            colors: ['#b4828a', '#d29596', '#dcabaa', '#e7b6b5'],
            contrast: 1.3,
            grain: 0.7,
            vignette: 0.08
          }
        },
        {
          id: 'mint-grove',
          label: 'Mint grove',
          effect: 'liquid',
          options: {
            colors: ['#04231a', '#0b6b52', '#17c493', '#c9f7e7'],
            contrast: 1.35,
            warp: 3.4,
            grain: 0.8
          }
        },
        {
          id: 'sunset-haze',
          label: 'Sunset haze',
          effect: 'liquid',
          options: {
            colors: ['#2b0b3a', '#7a1f56', '#e0563f', '#ffc36b'],
            scale: 2.8,
            contrast: 1.45,
            dots: { pitch: 4, size: 1.5 }
          }
        },
        {
          id: 'graphite',
          label: 'Graphite',
          effect: 'liquid',
          options: {
            colors: ['#0b0b0c', '#3a3a3f', '#8a8a92', '#f2f2f4'],
            contrast: 1.6,
            grain: 1.1,
            dots: { on: false }
          }
        },
        {
          id: 'aurora',
          label: 'Aurora',
          effect: 'goo',
          options: {
            colors: ['#021a2a', '#0a6b7a', '#2fd0b0', '#c6ffe9'],
            blobCount: 18,
            blobSize: 0.16,
            spread: 0.55,
            blur: 24,
            threshold: 10
          }
        },
        {
          id: 'ember',
          label: 'Ember',
          effect: 'goo',
          options: {
            colors: ['#1a0603', '#7a1f0a', '#e0562a', '#ffd08a'],
            blobCount: 16,
            blobSize: 0.16,
            spread: 0.55,
            blur: 22,
            threshold: 9
          }
        },
        {
          id: 'neon',
          label: 'Neon',
          effect: 'goo',
          options: {
            colors: ['#0a0014', '#5a00b3', '#ff2d9b', '#8affe4'],
            blobCount: 20,
            blobSize: 0.15,
            spread: 0.55,
            blur: 26,
            threshold: 11,
            grain: 0.5
          }
        }
      ];

      const presets = document.getElementById('presets');
      const code = document.getElementById('code');
      const note = document.getElementById('note');
      let current = PRESETS[0];
      let host = null;
      let tab = 'js';

      function flatten(options, prefix) {
        const rows = [];
        for (const [key, value] of Object.entries(options)) {
          const path = prefix ? prefix + '.' + key : key;
          if (value && typeof value === 'object' && !Array.isArray(value)) rows.push(...flatten(value, path));
          else rows.push([path, value]);
        }
        return rows;
      }

      function jsSnippet(preset) {
        const rows = flatten({ effect: preset.effect, ...preset.options });
        const body = rows.map(([path, value], index) => {
          const comma = index === rows.length - 1 ? '' : ',';
          return '    ' + JSON.stringify(path) + ': ' + JSON.stringify(value) + comma;
        });
        return [
          '<script src="dist/backdrops.js"><\/script>',
          '<script>',
          '  Backdrops.page({',
          ...body,
          '  });',
          '<\/script>'
        ].join('\n');
      }

      function htmlSnippet(preset) {
        const rows = flatten(preset.options);
        const attributes = rows.map(([path, value]) => '         data-backdrop-' + path.replace(/\./g, '-') + '="' + String(value).replace(/,/g, ',') + '"');
        return [
          '<section data-backdrop="' + preset.effect + '"',
          ...attributes.map((line, index) => line + (index === attributes.length - 1 ? '>' : '')),
          '  <h1>Your page</h1>',
          '</section>',
          '<script src="dist/backdrops.js"><\/script>',
          '<script>Backdrops.ready();<\/script>'
        ].join('\n');
      }

      function tone(colors) {
        let sum = 0;
        let count = 0;
        for (const value of colors) {
          const hex = String(value).replace('#', '');
          const full = hex.length === 3 ? hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2] : hex;
          const int = parseInt(full.slice(0, 6), 16);
          if (isNaN(int)) continue;
          sum += (0.2126 * ((int >> 16) & 255) + 0.7152 * ((int >> 8) & 255) + 0.0722 * (int & 255)) / 255;
          count++;
        }
        return count && sum / count > 0.55 ? 'light' : 'dark';
      }

      function render() {
        code.textContent = tab === 'js' ? jsSnippet(current) : htmlSnippet(current);
        note.textContent = current.effect + ' engine - ' + String(current.options.colors.length) + ' colours';
        for (const button of presets.children) {
          button.setAttribute('aria-pressed', String(button.dataset.id === current.id));
        }
        window.__preset = { ...current, snippet: code.textContent };
      }

      function apply(preset) {
        if (host) host.destroy();
        host = Backdrops.page({ effect: preset.effect, ...preset.options });
        document.documentElement.setAttribute('data-tone', tone(preset.options.colors));
        current = preset;
        render();
      }

      for (const preset of PRESETS) {
        const button = document.createElement('button');
        button.className = 'preset';
        button.dataset.id = preset.id;
        button.title = preset.effect;
        const label = document.createElement('span');
        label.textContent = preset.label;
        const bar = document.createElement('div');
        bar.className = 'bar';
        for (const color of preset.options.colors) {
          const cell = document.createElement('i');
          cell.style.background = color;
          bar.appendChild(cell);
        }
        button.append(label, bar);
        button.addEventListener('click', () => apply(preset));
        presets.appendChild(button);
      }

      document.getElementById('tab-js').addEventListener('click', () => {
        tab = 'js';
        document.getElementById('tab-js').setAttribute('aria-pressed', 'true');
        document.getElementById('tab-html').setAttribute('aria-pressed', 'false');
        render();
      });

      document.getElementById('tab-html').addEventListener('click', () => {
        tab = 'html';
        document.getElementById('tab-html').setAttribute('aria-pressed', 'true');
        document.getElementById('tab-js').setAttribute('aria-pressed', 'false');
        render();
      });

      document.getElementById('copy').addEventListener('click', () => {
        if (navigator.clipboard) navigator.clipboard.writeText(code.textContent);
        note.textContent = 'snippet copied';
      });

      apply(PRESETS[0]);
      window.backdrops = { host: () => host, presets: PRESETS, apply, snippet: () => code.textContent };
    </script>
  </body>
</html>
